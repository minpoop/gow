[package]
name = "gowring-dll"
version = "0.1.78"
edition = "2021"
description = "gowring.dll — the in-game half of Kratos in the Lands Between. Loaded by ModEngine2 into eldenring.exe."

[lib]
name = "gowring"
crate-type = ["cdylib"]

# Not a member of the main workspace (Windows-only deps); see packaging/build.sh.
[workspace]

[dependencies]
gowring-core = { path = "../gowring-core" }
# Elden Ring 2.7.2.0 (1.17.2, the current Steam build) is not in a crates.io release: upstream's 09a4208 carries its
# RVA table, and this commit (pull request #329, "Update shifted WorldChrMan fields", not merged yet) the WorldChrMan
# fields 1.17.2 moved (the by-distance list 0x10 further on; 0.1.57 crashed reading it on entering the world). From 2026-10-12 upstream is under the MIT NON-AI / Apache NON-AI
# licences: MIT or Apache-2.0 terms, plus no use of it to train or improve machine-learning models and no inclusion
# in such training data (packaging/licenses/eldenring-rs-LICENSE-MIT-NON-AI.txt ships with the release).
eldenring = { git = "https://github.com/vswarte/eldenring-rs", rev = "5baf0dd2243e2affa8bc436d27d7305c2eab9490" }
fromsoftware-shared = { git = "https://github.com/vswarte/eldenring-rs", rev = "5baf0dd2243e2affa8bc436d27d7305c2eab9490" }
# the game's singleton table (the same crate fromsoftware-shared looks singletons up with)
from-singleton = "3"
hudhook = { version = "0.9.3", default-features = false, features = ["dx12"] }
retour = "0.4.0-alpha.4"
png = "0.17"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security", "Win32_System_IO", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = 1
