[package]
name = "gowring-dll"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "gowring.dll — the in-game half of Kratos in the Lands Between. Loaded by ModEngine2 into eldenring.exe."

[lib]
name = "gowring"
crate-type = ["cdylib"]

# Not a member of the main workspace (Windows-only deps); see packaging/build.sh.
[workspace]

[dependencies]
gowring-core = { path = "../gowring-core" }
eldenring = "0.14"
fromsoftware-shared = "0.14"
hudhook = { version = "0.9.3", default-features = false, features = ["dx12"] }
retour = "0.4.0-alpha.4"
png = "0.17"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security", "Win32_System_IO",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = 1
