[package]
name = "gowring-core"
version.workspace = true
edition.workspace = true
description = "Ragnarök's rules (combat, rage, runics, stun, HUD model, Mimir) as a host-independent engine."
build = "build.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
png = { version = "0.17", optional = true }
fontdue = { version = "0.9", optional = true }

[features]
preview = ["dep:png", "dep:fontdue"]

[[bin]]
name = "hud-preview"
path = "src/bin/hud-preview.rs"
required-features = ["preview"]

[build-dependencies]
gowring-sheets = { path = "../gowring-sheets" }
