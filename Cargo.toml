[workspace]
resolver = "2"
members = [
  "crates/gowring-sheets",
  "crates/gowring-core",
  "crates/gowring-gow",
  "crates/gowring-launcher",
]
# gowring-dll is built separately for the Windows target (see packaging/build.sh):
# it pulls the Elden Ring bindings which only compile for x86_64-pc-windows-msvc.
exclude = ["crates/gowring-dll"]

[workspace.package]
version = "0.1.39"
edition = "2021"
repository = "https://github.com/minpoop/gow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
